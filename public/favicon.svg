<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.72 0.72 21.58 21.58" width="64" height="64" role="img" aria-label="Movie Night">
  <!--
    Marca de Movie Night: la claqueta de la cabecera, sin cuadrado de fondo.

    El viewBox es la caja exacta de la claqueta (medida con getBBox, trazo
    incluido) mas un margen minimo, asi que el dibujo llena la pestana en
    lugar de quedarse pequeno dentro de un recuadro.

    Sin fondo, el color lo pone el trazo, y tiene que verse tanto en una
    barra de pestanas oscura como en una clara. El valor por defecto es el
    claro a proposito: si un navegador ignorase la consulta de tema, se
    veria igualmente sobre la barra oscura, que es el caso habitual.
  -->
  <style>
    .marca { stroke: #fafafa; }
    @media (prefers-color-scheme: light) {
      .marca { stroke: #18181b; }
    }
  </style>

  <g
    class="marca"
    fill="none"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="m12.296 3.464 3.02 3.956" />
    <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z" />
    <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
    <path d="m6.18 5.276 3.1 3.899" />
  </g>
</svg>
