<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" role="img" aria-label="Quorum">
  <!--
    Marca de Quorum: un anillo de participacion abierto.

    El arco cubre el 89% de la circunferencia y deja una muesca de 40 grados
    arriba. Es la misma figura con la que la aplicacion representa cuanta
    gente ha respondido, que es justo lo que significa un quorum.

    La abertura esta medida: mas ancha y la figura se lee como una letra C
    o una herradura; mas estrecha y desaparece a 16px, que es el tamano al
    que lo vera la mayoria en la pestana del navegador.

    Va sin fondo y en naranja: ese color se distingue tanto en una barra de
    pestanas clara como en una oscura, asi que el icono es siempre el mismo
    y no hace falta adaptarlo al tema.
  -->
  <path
    d="M 9.26 4.48 A 8 8 0 1 0 14.74 4.48"
    fill="none"
    stroke="#ff7a00"
    stroke-width="4"
    stroke-linecap="round"
  />
</svg>
